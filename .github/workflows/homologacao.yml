# Homologação dos addons por plataforma: instala um Aprendiz novo (a main do
# aprendiz-dev) com os próprios scripts, importa os addons DESTE repositório e
# confere os pisos de acerto (tests/test_loja_homologacao.py do app): as 249
# perguntas de gente de verdade em cada busca e a base pessoal de exemplo.
name: Homologação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A saída tem "→" e "·": no Windows, sem isto, o console em cp1252 quebra.
env:
  PYTHONUTF8: "1"

jobs:
  linux:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nome: "Debian (estável)", imagem: "debian:stable" }
          - { nome: "Fedora (mais recente)", imagem: "fedora:latest" }
          - { nome: "Ubuntu (LTS)", imagem: "ubuntu:latest" }
          - { nome: "Ubuntu (mais recente)", imagem: "ubuntu:rolling" }
    steps:
      - name: Ferramentas que o checkout usa (tar/gzip)
        run: |
          if ! command -v tar >/dev/null; then
            if command -v dnf >/dev/null; then dnf install -y tar gzip
            else apt-get update && apt-get install -y tar gzip; fi
          fi
      - uses: actions/checkout@v7
        with:
          path: loja
      - uses: actions/checkout@v7
        with:
          repository: Jano-Projects/aprendiz-dev
          path: app
      - name: Instalar o Aprendiz
        working-directory: app
        run: bash instalar.sh --dev
      - name: Homologação (addons desta loja e base pessoal)
        working-directory: app
        run: .venv/bin/python -m pytest -q tests/test_loja_homologacao.py --loja ../loja

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: loja
      - uses: actions/checkout@v7
        with:
          repository: Jano-Projects/aprendiz-dev
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar o Aprendiz
        working-directory: app
        shell: cmd
        run: instalar.bat --dev
      - name: Homologação (addons desta loja e base pessoal)
        working-directory: app
        shell: cmd
        run: .venv\Scripts\python -m pytest -q tests\test_loja_homologacao.py --loja ..\loja
